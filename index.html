<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PicoRead</title>
<meta name="description" content="PicoRead - photograph a document's pages and listen to it. Everything stays on your device.">
<meta name="apple-mobile-web-app-title" content="PicoRead">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
    :root {
        --bg: #f6f3ee;
        --surface: #ffffff;
        --text: #1f1c18;
        --muted: #6b645b;
        --border: #ddd6cc;
        --accent: #2f6f6a;
        --accent-text: #ffffff;
        --reading: #e3f0ee;
        --error: #b3261e;
        color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #161513;
            --surface: #211f1c;
            --text: #f0ece6;
            --muted: #a39b90;
            --border: #3a3631;
            --accent: #6cc2b9;
            --accent-text: #0f1f1d;
            --reading: #1f3532;
            --error: #ff8a80;
            color-scheme: dark;
        }
    }
    * {
        box-sizing: border-box;
    }
    html {
        -webkit-text-size-adjust: 100%;
    }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #app {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 16px calc(24px + env(safe-area-inset-bottom));
    }
    button, .button, select, input, textarea {
        font: inherit;
        color: inherit;
    }
    button, .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        cursor: pointer;
    }
    button:disabled {
        opacity: 0.4;
        cursor: default;
    }
    .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
    }
    .icon {
        min-width: 40px;
        min-height: 40px;
        padding: 0;
    }
    select {
        min-height: 44px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        max-width: 100%;
    }
    .bar {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: calc(12px + env(safe-area-inset-top)) 0 12px;
        background: var(--bg);
    }
    .bar h1 {
        margin: 0;
        font-size: 24px;
    }
    /* The app's name and tagline beside its icon (the icon the height of the two) */
    .masthead {
        gap: 12px;
    }
    .masthead-icon {
        flex: none;
        width: calc(24px * 1.1 + 2px + 16px * 1.3);
        height: calc(24px * 1.1 + 2px + 16px * 1.3);
    }
    .masthead h1 {
        line-height: 1.1;
    }
    .tagline {
        margin: 2px 0 0;
        line-height: 1.3;
        color: var(--muted);
    }
    .back {
        min-width: 44px;
        padding: 0;
        font-size: 24px;
    }
    .doc-title {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        font-size: 20px;
        font-weight: 600;
    }
    .doc-title:focus {
        border-color: var(--border);
        background: var(--surface);
    }
    .documents, .pages {
        list-style: none;
        margin: 16px 0;
        padding: 0;
        display: grid;
        gap: 10px;
    }
    .documents li {
        display: flex;
        gap: 8px;
    }
    .documents .open {
        flex: 1;
        min-width: 0;
        flex-direction: column;
        align-items: flex-start;
        padding: 10px 16px;
        text-align: left;
    }
    .documents .title {
        font-weight: 600;
        overflow-wrap: anywhere;
    }
    .documents small, .status, .empty {
        color: var(--muted);
    }
    .documents .delete {
        min-height: auto;
    }
    .new {
        margin-top: 8px;
    }
    .player {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
    }
    .player .play {
        min-width: 96px;
    }
    .player .voice {
        flex: 1;
        min-width: 160px;
    }
    .now-reading {
        flex-basis: 100%;
        margin: 0;
        color: var(--muted);
        font-style: italic;
    }
    .now-reading:empty {
        display: none;
    }
    .page {
        display: flex;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
    }
    .page.reading {
        background: var(--reading);
        border-color: var(--accent);
    }
    .photo {
        flex: none;
        align-self: flex-start;
        min-height: 0;
        padding: 0;
        border: none;
        background: none;
        cursor: zoom-in;
    }
    .thumbnail {
        display: block;
        flex: none;
        width: 72px;
        height: 96px;
        object-fit: cover;
        border-radius: 6px;
        background: var(--border);
    }
    .page-body {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 8px;
    }
    .page-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
    }
    .page-actions {
        display: flex;
        gap: 4px;
        margin-left: auto;
    }
    .page-adjust {
        display: flex;
        gap: 4px;
    }
    .text {
        width: 100%;
        min-height: 120px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        resize: vertical;
        font-size: 15px;
    }
    .add {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
    }
    .empty {
        margin: 24px 0;
    }
    .message {
        color: var(--error);
    }
    .camera {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        background: #000;
        color: #fff;
    }
    .viewfinder {
        flex: 1;
        min-height: 0;
        width: 100%;
        object-fit: contain;
    }
    .camera-controls {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    }
    .camera-count {
        font-size: 14px;
    }
    .shutter {
        width: 72px;
        height: 72px;
        padding: 0;
        border: 4px solid #9a9a9a;
        border-radius: 50%;
        background: #fff;
    }
    .shutter:disabled {
        opacity: 0.5;
    }
    .camera-ends {
        display: flex;
        gap: 8px;
        justify-self: end;
    }
    .camera-mirror {
        min-width: 44px;
        padding: 0;
        border-color: rgba(255, 255, 255, 0.6);
        background: transparent;
        color: #fff;
        font-size: 20px;
    }
    .camera-mirror[aria-pressed="true"] {
        background: rgba(255, 255, 255, 0.25);
    }
    .camera-done {
        border-color: rgba(255, 255, 255, 0.6);
        background: transparent;
        color: #fff;
    }
    .viewer {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        background: rgba(0, 0, 0, 0.92);
    }
    .viewer-frame {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
    }
    .viewer-image {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        cursor: zoom-in;
    }
    .viewer-frame.zoomed {
        display: block;
    }
    .viewer-frame.zoomed .viewer-image {
        max-width: none;
        max-height: none;
        cursor: zoom-out;
    }
    .viewer-close {
        position: absolute;
        top: calc(12px + env(safe-area-inset-top));
        right: 12px;
        min-width: 44px;
        padding: 0;
        border-color: rgba(255, 255, 255, 0.6);
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
    }
    @media (max-width: 480px) {
        .page {
            flex-direction: column;
        }
        .photo {
            align-self: stretch;
        }
        .thumbnail {
            width: 100%;
            height: 140px;
        }
    }
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import {main} from './lib/app.js';
main(window);
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
